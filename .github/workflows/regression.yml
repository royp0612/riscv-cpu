# Runs the full testbench regression on every push and pull request.
name: RTL Regression

on: [push, pull_request]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Run regression
        run: python3 scripts/regress.py
